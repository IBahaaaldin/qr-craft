<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card: #161e31;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --word-color: #2563eb;
      --excel-color: #16a34a;
      --ppt-color: #ea580c;
      --pdf-color: #dc2626;
      --radius: 18px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.25rem 1.75rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
    }
    .file-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.25rem;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
    }
    .app-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      margin-bottom: 0.65rem;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 0.4rem;
      word-break: break-word;
    }
    .file-sub {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 1.75rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn {
      width: 100%;
      padding: 0.85rem 1.25rem;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .btn-app {
      color: #ffffff;
    }
    .btn-app:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .empty-state {
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="card" id="mainCard">
    <div class="file-badge" id="iconBadge">📄</div>
    <span class="app-tag" id="appTag">Document</span>
    <h1 id="docName">Document</h1>
    <div class="file-sub" id="docSub">Choose how to open this file</div>

    <div class="actions" id="actionButtons">
      <!-- Main "Open in App" Button -->
      <a href="#" class="btn btn-app" id="primaryAppBtn" onclick="openInApp(event)">
        <span id="primaryBtnIcon">📱</span>
        <span id="primaryBtnText">Open in App</span>
      </a>

      <!-- Secondary "Open in Browser" Button -->
      <a href="#" class="btn btn-secondary" id="browserBtn" target="_blank">
        <span>🌐 Open in Browser</span>
      </a>

      <!-- Direct Download Button -->
      <a href="#" class="btn btn-secondary" id="downloadBtn" download>
        <span>⬇️ Download File</span>
      </a>
    </div>

    <div class="footer-note" id="tipNote">
      Opens directly in your supported application or browser.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const fileUrl = params.get('file') || '';
    const rawName = params.get('name') || (fileUrl ? fileUrl.split('/').pop().split('?')[0] : '');
    const fileName = decodeURIComponent(rawName || 'Document');
    const ext = fileName.includes('.') ? fileName.split('.').pop().toLowerCase() : '';

    if (!fileUrl) {
      document.getElementById('docName').textContent = 'QR Document Viewer';
      document.getElementById('docSub').textContent = 'No file linked to this QR code yet.';
      document.getElementById('actionButtons').innerHTML = `
        <div class="empty-state">Scan a valid file QR code to launch it here.</div>
      `;
      document.getElementById('tipNote').style.display = 'none';
    } else {
      document.getElementById('docName').textContent = fileName.replace(/_/g, ' ');
      document.getElementById('browserBtn').href = fileUrl;
      document.getElementById('downloadBtn').href = fileUrl;

      const iconBadge = document.getElementById('iconBadge');
      const appTag = document.getElementById('appTag');
      const primaryAppBtn = document.getElementById('primaryAppBtn');
      const primaryBtnIcon = document.getElementById('primaryBtnIcon');
      const primaryBtnText = document.getElementById('primaryBtnText');
      const tipNote = document.getElementById('tipNote');

      let deepLinkScheme = '';

      if (ext === 'docx' || ext === 'doc') {
        iconBadge.textContent = '📝';
        appTag.textContent = 'Microsoft Word Document';
        appTag.style.background = 'rgba(37, 99, 235, 0.15)';
        appTag.style.color = '#3b82f6';
        primaryAppBtn.style.background = '#2563eb';
        primaryBtnIcon.textContent = '🟦';
        primaryBtnText.textContent = 'Open in Microsoft Word';
        tipNote.textContent = 'Tapping will launch Microsoft Word if installed on your device.';
        if (fileUrl.includes('gofile.io')) {
          deepLinkScheme = fileUrl;
        } else {
          deepLinkScheme = `ms-word:ofv|u|${encodeURI(fileUrl)}`;
        }
      } else if (ext === 'xlsx' || ext === 'xls') {
        iconBadge.textContent = '📊';
        appTag.textContent = 'Microsoft Excel Spreadsheet';
        appTag.style.background = 'rgba(22, 163, 74, 0.15)';
        appTag.style.color = '#22c55e';
        primaryAppBtn.style.background = '#16a34a';
        primaryBtnIcon.textContent = '🟩';
        primaryBtnText.textContent = 'Open in Microsoft Excel';
        deepLinkScheme = `ms-excel:ofe|u|${encodeURI(fileUrl)}`;
      } else if (ext === 'pptx' || ext === 'ppt') {
        iconBadge.textContent = '📽️';
        appTag.textContent = 'Microsoft PowerPoint Presentation';
        appTag.style.background = 'rgba(234, 88, 12, 0.15)';
        appTag.style.color = '#f97316';
        primaryAppBtn.style.background = '#ea580c';
        primaryBtnIcon.textContent = '🟧';
        primaryBtnText.textContent = 'Open in Microsoft PowerPoint';
        deepLinkScheme = `ms-powerpoint:ofe|u|${encodeURI(fileUrl)}`;
      } else if (ext === 'pdf') {
        iconBadge.textContent = '📕';
        appTag.textContent = 'PDF Document';
        appTag.style.background = 'rgba(220, 38, 38, 0.15)';
        appTag.style.color = '#ef4444';
        primaryAppBtn.style.background = '#dc2626';
        primaryBtnIcon.textContent = '📕';
        primaryBtnText.textContent = 'Open PDF Document';
        deepLinkScheme = fileUrl;
      } else {
        iconBadge.textContent = '📄';
        appTag.textContent = 'Document';
        primaryAppBtn.style.background = '#4f46e5';
        primaryBtnIcon.textContent = '📄';
        primaryBtnText.textContent = 'Open Document';
        deepLinkScheme = fileUrl;
      }

      window.openInApp = function(e) {
        e.preventDefault();
        if (!deepLinkScheme || deepLinkScheme.startsWith('http')) {
          window.location.href = fileUrl;
          return;
        }

        // Try launching native app
        window.location.href = deepLinkScheme;

        // Fallback: If app isn't installed, navigate to the file in browser after delay
        setTimeout(() => {
          window.location.href = fileUrl;
        }, 1500);
      };
    }
  </script>
</body>
</html>
